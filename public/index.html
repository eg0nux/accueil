<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>ego/nux</title>
    <meta name="description" content="ego/nux" />

    <script>
      try {
        var choix = localStorage.getItem("theme")
        if (choix === "dark" || choix === "light") {
          document.documentElement.dataset.theme = choix
        }
      } catch (e) {}
    </script>

    <style>
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 700;
        font-display: swap;
        src: url("/fonts/jetbrains-mono-700-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/jetbrains-mono-400-latin.woff2") format("woff2");
      }

      :root {
        --papier: #fafafa;
        --encre: #212121;
        --rouge: #d32f2f;
        --gris: #8c8578;
        --anthracite: #38352f;
        --rouge-vif: #f44336;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --papier: #1c1b19;
          --encre: #f6ece0;
          --rouge: #f4675c;
          --gris: #7d786d;
          --anthracite: #ded8cc;
          --rouge-vif: #f4675c;
        }
      }

      :root[data-theme="dark"] {
        --papier: #1c1b19;
        --encre: #f6ece0;
        --rouge: #f4675c;
        --gris: #7d786d;
        --anthracite: #ded8cc;
        --rouge-vif: #f4675c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.2rem;
        padding: 5.5rem 2rem 7rem;
        background: var(--papier);
        font-family: "JetBrains Mono", ui-monospace, monospace;
        -webkit-font-smoothing: antialiased;
      }

      .projets {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2.2rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-weight: 700;
        font-size: clamp(1.5rem, 5vw, 2.4rem);
        letter-spacing: -0.02em;
        line-height: 1.1;
        color: var(--encre);
        text-decoration: none;
      }

      .logo b {
        color: var(--rouge);
        font-weight: 700;
      }

      .logo:focus-visible {
        outline: 2px solid var(--rouge);
        outline-offset: 0.35em;
        border-radius: 2px;
      }

      .logo .pile {
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }

      .logo .marque {
        white-space: nowrap;
      }

      .logo .section {
        font-weight: 400;
        font-size: 0.56em;
        letter-spacing: 0.08em;
        color: var(--anthracite);

        width: fit-content;
        margin: 0.1em calc(0.58em / 0.56) 0 auto;

        --surlignage: color-mix(in srgb, var(--rouge-vif) 60%, transparent);
        line-height: 1;
        background-image: linear-gradient(
          180deg,
          transparent 14%,
          var(--surlignage) 14%,
          var(--surlignage) 86%,
          transparent 86%
        );
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .logo .section {
          --surlignage: var(--rouge-vif);
          color: var(--papier);
        }
      }

      :root[data-theme="dark"] .logo .section {
        --surlignage: var(--rouge-vif);
        color: var(--papier);
      }

      .bascule {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 2.9em;
        height: 2.9em;
        padding: 0;
        font: inherit;
        font-size: 0.9rem;
        background: none;
        border: none;
        color: var(--gris);
        cursor: pointer;
        transition: color 0.18s;
      }

      .bascule:hover,
      .bascule:focus-visible {
        color: var(--rouge);
        outline: none;
      }

      .bascule svg {
        width: 1.4em;
        height: 1.4em;
      }

      .bascule .soleil {
        display: none;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .bascule .soleil {
          display: block;
        }
        :root:not([data-theme="light"]) .bascule .lune {
          display: none;
        }
      }

      :root[data-theme="dark"] .bascule .soleil {
        display: block;
      }

      :root[data-theme="dark"] .bascule .lune {
        display: none;
      }

      :root[data-theme="light"] .bascule .soleil {
        display: none;
      }

      :root[data-theme="light"] .bascule .lune {
        display: block;
      }

      .glyphe {
        font-size: clamp(2.6rem, 9vw, 4.4rem);
        font-weight: 700;
        line-height: 1;
        color: var(--rouge);
        user-select: none;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .glyphe {
          color: var(--encre);
        }
      }

      :root[data-theme="dark"] .glyphe {
        color: var(--encre);
      }

      :root[data-theme="light"] .glyphe {
        color: var(--rouge);
      }

      @keyframes soubresaut {
        0% {
          transform: translate(0, 0) rotate(0deg);
        }
        20% {
          transform: translate(-2px, 1px) rotate(-3deg);
        }
        40% {
          transform: translate(2px, -1px) rotate(3deg);
        }
        60% {
          transform: translate(-1px, -1px) rotate(-2deg);
        }
        80% {
          transform: translate(1px, 1px) rotate(1deg);
        }
        100% {
          transform: translate(0, 0) rotate(0deg);
        }
      }

      .glyphe.tremble {
        animation: soubresaut 0.36s ease-in-out;
      }

      @media (prefers-reduced-motion: reduce) {
        .glyphe.tremble {
          animation: none;
        }
      }

      footer {
        position: absolute;
        bottom: 2rem;
        left: 0;
        right: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.9rem;
        padding: 0 1.5rem;
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--gris);
      }

      footer p {
        margin: 0;
      }

      footer a {
        color: var(--gris);
        text-decoration: none;
        border-bottom: 1px solid color-mix(in srgb, var(--gris) 45%, transparent);
      }

      footer a:hover {
        color: var(--rouge);
        border-bottom-color: var(--rouge);
      }
    </style>
  </head>

  <body>
    <ul class="projets">
      <li>
        <a class="logo" href="https://fablab.egonux.com/"
          ><span class="pile"><span class="marque"><b>{</b>fablab<b>}</b></span><span class="section">/DOC</span></span></a
        >
      </li>
      <li>
        <a class="logo" href="https://lab.egonux.com/"
          ><span class="pile"><span class="marque"><b>{</b>fablab<b>}</b></span><span class="section">/PROJETS</span></span></a
        >
      </li>
      <li>
        <a class="logo" href="https://maquette.egonux.com/"
          ><span class="pile"><span class="marque"><b>{</b>maquette<b>}</b></span><span class="section">/LATRAVERSE</span></span></a
        >
      </li>
    </ul>

    <button class="bascule" type="button" aria-label="Basculer entre le thème clair et le thème sombre">
      <svg
        class="soleil"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4.2" />
        <path
          d="M12 2v2.6M12 19.4V22M4.2 4.2l1.9 1.9M17.9 17.9l1.9 1.9M2 12h2.6M19.4 12H22M4.2 19.8l1.9-1.9M17.9 6.1l1.9-1.9"
        />
      </svg>
      <svg
        class="lune"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" />
      </svg>
    </button>

    <div class="glyphe" aria-hidden="true">#</div>

    <footer>
      <p>© 2026</p>
      <p><a href="mailto:florian@egonux.com">Florian</a></p>
    </footer>
    <script>
      document.querySelector(".bascule").addEventListener("click", function () {
        var racine = document.documentElement
        var sombre = racine.dataset.theme
          ? racine.dataset.theme === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches
        var voulu = sombre ? "light" : "dark"
        racine.dataset.theme = voulu
        try {
          localStorage.setItem("theme", voulu)
        } catch (e) {}
      })
    </script>
    <script>
      ;(function () {
        var glyphes = ["{", "/", "#", "&"]
        var cible = document.querySelector(".glyphe")
        function changer() {
          var suivant
          do {
            suivant = glyphes[Math.floor(Math.random() * glyphes.length)]
          } while (suivant === cible.textContent)
          cible.textContent = suivant
          cible.classList.remove("tremble")
          void cible.offsetWidth
          cible.classList.add("tremble")
          setTimeout(changer, 700 + Math.random() * 1100)
        }
        setTimeout(changer, 900)
      })()
    </script>
  </body>
</html>
