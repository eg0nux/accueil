# Publie la page d'accueil à chaque poussée.
#
# Rien à construire : le dossier public/ est le site, servi tel quel par un
# Worker sans code (voir wrangler.jsonc). Ce n'est pas un projet Pages : y
# brancher un domaine personnalisé passe obligatoirement par le tableau de
# bord, là où un Worker déclare sa route dans sa configuration.

name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
