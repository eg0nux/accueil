# Publie la page d'accueil sur Cloudflare Pages à chaque poussée.
#
# Rien à construire : le dossier public/ est le site. On le pousse tel quel,
# avec un jeton d'API plutôt que par l'intégration Git de Cloudflare — celle-ci
# mémorise l'identifiant GitHub du dépôt et ne survit pas à sa recréation.

name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=accueil-egonux --branch=main
